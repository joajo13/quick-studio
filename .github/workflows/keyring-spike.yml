name: Keyring Spike

# Story 2.1 — prove @napi-rs/keyring under Bun per-platform (AR-20). Each matrix
# leg runs the SAME committed smoke (src/core/keychain.test.ts) under Bun, and a
# compiled-binary native-load check that mirrors the real `bun build --compile`
# distribution path. The smoke is green whether the platform round-trips OR
# reports keychain-unavailable, so a keychain-less leg is a recorded outcome, not
# a red build.

on:
  push:
    paths:
      - "src/core/keychain.ts"
      - "src/core/keychain.test.ts"
      - "scripts/keyring-native-check.ts"
      # DW-89 moved the round-trip BODY here (the script above is now a thin
      # wrapper), so the AR-20 attestation must still trigger on its semantics.
      - "src/core/keychain-self-check.ts"
      - ".github/workflows/keyring-spike.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

jobs:
  spike:
    name: keyring smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Cheap insurance: this job spawns a keyring daemon and runs self-compiled
    # binaries, either of which could hang; cap it so a stuck leg fails fast
    # instead of running to the 6h default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pin so the AR-20 parity attestation is tied to a known Bun version,
          # not whatever "latest" happens to be on the passing run. Same version
          # as every other leg, so the spike and the release gate attest to the
          # same runtime.
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --- Linux: provision Secret Service so the round-trip can be attempted ---
      # A GitHub ubuntu runner is headless with no unlocked keyring, so without
      # this the wrapper would (correctly) report keychain-unavailable. We start a
      # private D-Bus session and an unlocked login keyring, then run the smoke
      # inside it so the Linux leg exercises a REAL round-trip.
      - name: Install Secret Service (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-1-0

      - name: Keychain smoke + compiled-binary check (Linux)
        if: runner.os == 'Linux'
        # This leg provisions a real Secret Service below, so it MUST prove a real
        # round-trip — REQUIRE_ROUNDTRIP makes the native-check fail (not silently
        # pass on `unavailable`) if provisioning didn't actually yield a backend.
        env:
          KEYRING_REQUIRE_ROUNDTRIP: "1"
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail
            # Unlock a fresh login keyring with an empty password and expose it
            # as org.freedesktop.secrets for the child processes.
            echo "" | gnome-keyring-daemon --unlock --components=secrets,pkcs11,ssh
            bun test src/core/keychain.test.ts
            bun build --compile scripts/keyring-native-check.ts --outfile ./keyring-native-check
            ./keyring-native-check
          '

      # --- macOS: provision an unlocked default keychain for the round-trip ---
      # A GitHub macOS runner boots with a locked/default-less login keychain, so
      # a headless @napi-rs/keyring generic-password call would (correctly) report
      # keychain-unavailable — the macOS analogue of the headless-Linux case. We
      # create a dedicated keychain with an empty password, disable its auto-lock
      # timeout so it stays open for the whole leg, unlock it, make it the default
      # (so security-framework's default-keychain calls target it), and add it to
      # the user search list — mirroring how the Linux leg provisions Secret
      # Service — so the compiled-binary check exercises a REAL round-trip.
      - name: Provision keychain (macOS)
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p "" spike.keychain
          # No flags = no lock-on-sleep and no inactivity timeout, so the keychain
          # stays unlocked for the whole leg (an explicit `-t` would RE-ENABLE a
          # timeout, which we do not want).
          security set-keychain-settings spike.keychain
          security unlock-keychain -p "" spike.keychain
          security default-keychain -s spike.keychain
          # Point the user search list at ONLY the spike keychain. The runner's
          # login.keychain-db boots locked, and a SecItem search that traverses it
          # can raise an unlock prompt that hangs a headless runner; the round-trip
          # only needs the spike keychain, so keep it out of the list.
          security list-keychains -d user -s spike.keychain
          # Grant non-interactive access to items in this keychain. Without it a
          # generic-password read can raise a GUI authorization dialog that nobody
          # can dismiss on a headless runner, hanging the leg to its timeout.
          security set-key-partition-list -S apple-tool:,apple: -s -k "" spike.keychain

      # --- Windows / others: Credential Manager is always present ---
      - name: Keychain smoke (non-Linux)
        if: runner.os != 'Linux'
        run: bun test src/core/keychain.test.ts

      - name: Compiled-binary native-load check (non-Linux)
        if: runner.os != 'Linux'
        # Windows (Credential Manager) and macOS (the keychain provisioned above)
        # both have a real backend, so a round-trip is expected and required — a
        # mere `unavailable` here is a failure, not a pass.
        # Force bash: on windows-latest the default shell is PowerShell, where
        # `bun build --compile` emits `keyring-native-check.exe` and `./name`
        # would not resolve it; Git Bash appends `.exe`, so the compiled binary
        # runs deterministically. (macOS already defaults to bash.)
        shell: bash
        env:
          KEYRING_REQUIRE_ROUNDTRIP: "1"
        run: |
          bun build --compile scripts/keyring-native-check.ts --outfile ./keyring-native-check
          ./keyring-native-check
