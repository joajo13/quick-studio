# Publish the npm packages for a release, via OIDC Trusted Publishing.
#
# The filename `publish.yml` is LOAD-BEARING: it is registered with npm's
# Trusted Publisher setting for each of the four packages (`quick-studio` plus
# the three `quick-studio-<platform>-<arch>`). Renaming this file silently breaks
# every publish until all four trusted publishers are reconfigured to match.
#
# This workflow does NOT build binaries — `release.yml` is the sole builder and
# owns the tag. This runs after the GitHub Release exists, downloads its assets,
# packages them (scripts/build-npm-packages.ts), and publishes platform packages
# first, main package last. Auth is OIDC only — no NPM_TOKEN anywhere.

name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

# Serialize publishes so two release events can never race the strict
# platform-first / main-last ordering. Never cancel a run mid-publish.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A hung `npm publish` / OIDC token exchange must not sit on the serialized
    # `publish-npm` concurrency group until GitHub's 6h default and block every
    # subsequent release behind it. Cap the whole publish at a modest ceiling.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Trusted Publishing requires Node >= 22.14.0 and npm >= 11.5.1 on a
      # GitHub-hosted runner. Pin them explicitly rather than inheriting.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Pin npm to a Trusted-Publishing-capable version
        run: |
          # Pin explicitly (not @latest) so the npm that holds publish creds is
          # reproducible and >= 11.5.1 (the Trusted Publishing floor). Bump this
          # deliberately, never implicitly.
          npm install -g npm@11.5.1
          npm_version="$(npm --version)"
          echo "npm version: $npm_version"
          required="11.5.1"
          lowest="$(printf '%s\n%s\n' "$required" "$npm_version" | sort -V | head -n1)"
          if [ "$lowest" != "$required" ]; then
            echo "npm $npm_version is below the required $required for Trusted Publishing" >&2
            exit 1
          fi

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          # Derived from scripts/platforms.ts so a future macOS row propagates
          # here too, rather than hardcoding a fourth copy of the asset list.
          mapfile -t REQUIRED < <(bun scripts/platforms.ts --assets)
          # `set -e` does not propagate out of a process substitution and
          # `mapfile` exits 0 on empty input: an empty REQUIRED would make the
          # poll's `ok=1` succeed on the first attempt with zero binaries
          # downloaded, bypassing the entire DW-83 retry window.
          if [ "${#REQUIRED[@]}" -eq 0 ]; then
            echo "publish: could not read the platform table" >&2
            exit 1
          fi
          # The `release: published` event can fire before release.yml has finished
          # attaching every binary. `gh release download` exits 0 on a partial set,
          # so poll until all expected assets are present (or give up loudly).
          for attempt in 1 2 3 4 5 6; do
            rm -rf bin-dl
            gh release download "$TAG" --dir bin-dl || true
            ok=1
            for a in "${REQUIRED[@]}"; do
              if [ ! -s "bin-dl/$a" ]; then
                ok=0
                break
              fi
            done
            if [ "$ok" = "1" ]; then
              echo "all release binaries present"
              exit 0
            fi
            echo "release assets not all present yet (attempt $attempt); waiting 20s"
            sleep 20
          done
          echo "release binaries never fully materialized for $TAG" >&2
          ls -la bin-dl || true
          exit 1

      # DW-80. Every version below is derived from the TAG (`VERSION="${TAG#v}"`),
      # but the binaries about to be wrapped carry whatever package.json said when
      # release.yml compiled them. release.yml's DW-90 guard asserts tag ==
      # package.json at COMPILE time; this is the end-to-end witness that the
      # artifact actually attached to this release says the same thing — which
      # also catches a stale asset left on a re-pushed tag, something no guard in
      # release.yml can see. A mismatch ships quick-studio@1.2.0 around a binary
      # printing 0.0.1, and src/core/update-check.ts turns that into a permanent
      # phantom "update available" for every user on the newest release.
      #
      # It sits strictly between the download and `Build npm packages` so the
      # failure lands before dist-npm exists and long before any `npm publish` —
      # npm versions are immutable and we never unpublish, so "too late" is
      # literally unrecoverable.
      #
      # Only linux-x64 is checked: ubuntu-latest can natively execute nothing
      # else here, and emulating the .exe / arm64 binary (qemu, wine) is
      # deliberately out of scope. Be honest about what that samples. Within ONE
      # release.yml run all three legs bake the same package.json, so one binary
      # witnesses the whole set. It does NOT cover a per-asset divergence — an
      # asset re-uploaded by hand onto an existing release — even though that is
      # exactly the case DW-90 cannot see either. Closing that needs the
      # SHA256SUMS file already sitting unverified in bin-dl/; tracked separately.
      #
      # This is also the ONLY version guard on a release created from the GitHub
      # UI: publish.yml triggers on `release: published`, while release.yml's
      # DW-90 guard only ever runs on `push: tags: v*`.
      - name: "Guard: binary version matches the tag"
        # The tag arrives as an `env:` value and is never interpolated into the
        # script source — the same reason release.yml's twin reads
        # GITHUB_REF_NAME. A git refname may legally contain shell
        # metacharacters, and this job holds the OIDC Trusted-Publishing
        # credentials for all four published packages.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # An empty VERSION would make the comparison below vacuously "agree"
          # on a malformed tag; release.yml's twin refuses the same shape.
          if [ -z "$VERSION" ]; then
            echo "publish: tag $TAG yields an empty version" >&2
            exit 1
          fi
          # `--asset` exits 1 on an unknown key, and under `set -e` a failing
          # substitution aborts the step BEFORE any later check can run — so the
          # explanatory message must live on the failure branch of the assignment
          # itself, not in a trailing `-z` test that would be unreachable. The
          # `-z` arm still covers a hypothetical empty-but-successful read, which
          # would otherwise degrade the path below to `bin-dl/` — a directory.
          if ! ASSET="$(bun scripts/platforms.ts --asset linux-x64)" || [ -z "$ASSET" ]; then
            echo "publish: could not resolve the linux-x64 asset from the platform table" >&2
            echo "publish: scripts/platforms.ts no longer has a linux-x64 row, so this guard has no natively runnable binary" >&2
            exit 1
          fi
          # `gh release download` writes assets 0644, so the binary cannot report
          # its own version until it is executable. If it still cannot run, the
          # `$(...)` below fails and `set -e` aborts the step.
          #
          # This mutates bin-dl/, which `Build npm packages` consumes next. That
          # is harmless rather than accidental: build-npm-packages.ts chmods its
          # own copy to 0755 regardless, so the mode here changes nothing downstream.
          chmod +x "bin-dl/$ASSET"
          BIN_VERSION="$("./bin-dl/$ASSET" --version)"
          # `--version` writes a bare `${VERSION}\n` and exits 0 before the Core
          # boots (bin/quick-studio.ts), so this is the whole stdout, minus the
          # newline `$(...)` strips. Exact string equality, never semver-aware:
          # prerelease tags (v1.2.0-beta.1) compare unchanged.
          if [ "$BIN_VERSION" != "$VERSION" ]; then
            echo "publish: release binary $ASSET reports version $BIN_VERSION but tag $TAG implies $VERSION" >&2
            echo "publish: the release assets were built from a different package.json — re-run release.yml for $TAG rather than publishing this" >&2
            exit 1
          fi
          echo "release binary $ASSET and tag $TAG agree on $VERSION"

      - name: Build npm packages
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          bun scripts/build-npm-packages.ts --binaries bin-dl --version "$VERSION" --out dist-npm

      # Publish order is load-bearing: every platform package first, main package
      # LAST — the main package's optionalDependencies must be resolvable the
      # moment it becomes installable. No --access flag (unscoped = public by
      # default). No NPM_TOKEN — Trusted Publishing (OIDC) mints a short-lived
      # signed token per run from the id-token permission above.
      - name: Publish platform packages, then the main package
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          # A GitHub prerelease must not land on the `latest` dist-tag, or
          # `npm i quick-studio` would serve a beta to everyone.
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi
          echo "Publishing $VERSION to dist-tag: $NPM_TAG"
          # Idempotent: if a prior run already published a package at this exact
          # version (a transient mid-sequence failure, a re-run), skip it rather
          # than abort — npm rejects a duplicate version and we never unpublish.
          publish_one() {
            dir="$1"
            pkg="$(basename "$dir")"  # dir basename == package name for all four
            # `npm publish a/b` does NOT mean the directory `a/b`: npm reads a bare
            # `owner/name` argument as the GitHub shorthand and tries to
            # `git ls-remote ssh://git@github.com/a/b.git`, which fails with
            # `Permission denied (publickey)` / exit 128 on a runner with no SSH key.
            # Only a path starting with `./`, `../` or `/` is treated as local.
            # Normalized HERE rather than at the call sites so no future caller can
            # reintroduce it — the v0.1.0 attempt died on exactly this.
            case "$dir" in
              /*|./*|../*) ;;
              *) dir="./$dir" ;;
            esac
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "· $pkg@$VERSION already published — skipping"
            else
              npm publish "$dir" --tag "$NPM_TAG"
            fi
          }
          # Strict order: every platform package first, main package LAST.
          # Derived from scripts/platforms.ts (not hardcoded) so a future row is
          # actually PUBLISHED, instead of being built, checksummed, downloaded,
          # packaged — and then silently skipped, leaving the main package's
          # optionalDependencies naming a package that does not exist on npm.
          mapfile -t PKGS < <(bun scripts/platforms.ts --packages)
          if [ "${#PKGS[@]}" -eq 0 ]; then
            echo "publish: could not read the platform table" >&2
            exit 1
          fi
          for p in "${PKGS[@]}"; do
            publish_one "dist-npm/$p"
          done
          publish_one dist-npm/quick-studio
